name: IndexNow

on:
  check_run:
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Submission mode
        required: true
        default: sitemap
        type: choice
        options:
          - sitemap
          - urls
      urls:
        description: Space- or newline-separated absolute URLs for mode=urls
        required: false
        type: string

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
        github.event.check_run.name == 'Cloudflare Pages' &&
        github.event.check_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'check_run' && github.event.check_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover IndexNow key file
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find public -maxdepth 1 -type f -name '*.txt' ! -name 'robots.txt' | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one IndexNow key file in public/, found ${#files[@]}" >&2
            exit 1
          fi

          key_path="${files[0]}"
          key_file="$(basename "$key_path")"
          key="$(tr -d '\r\n' < "$key_path")"
          key_stem="${key_file%.txt}"

          if [ "$key" != "$key_stem" ]; then
            echo "IndexNow key file contents must match filename: $key_file" >&2
            exit 1
          fi

          {
            echo "key_file=$key_file"
            echo "key_url=https://cloudpresser.com/$key_file"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for production site to serve the new key and sitemap
        shell: bash
        run: |
          set -euo pipefail
          key_url='${{ steps.key.outputs.key_url }}'
          sitemap_url='https://cloudpresser.com/sitemap.xml'

          for attempt in $(seq 1 30); do
            key_status="$(curl -sS -o /tmp/indexnow-key.txt -w '%{http_code}' "$key_url" || true)"
            sitemap_status="$(curl -sS -o /tmp/indexnow-sitemap.xml -w '%{http_code}' "$sitemap_url" || true)"

            if [ "$key_status" = '200' ] && [ "$sitemap_status" = '200' ]; then
              key_body="$(tr -d '\r\n' < /tmp/indexnow-key.txt)"
              key_stem='${{ steps.key.outputs.key_file }}'
              key_stem="${key_stem%.txt}"

              if [ "$key_body" = "$key_stem" ] && grep -q '<loc>https://cloudpresser.com' /tmp/indexnow-sitemap.xml; then
                exit 0
              fi
            fi

            sleep 10
          done

          echo 'Production site did not become ready for IndexNow submission in time.' >&2
          exit 1

      - name: Submit full sitemap to IndexNow
        if: github.event_name == 'check_run' || inputs.mode == 'sitemap'
        run: node scripts/indexnow-submit.mjs

      - name: Submit explicit URLs to IndexNow
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'urls'
        shell: bash
        env:
          INPUT_URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          urls="$(printf '%s\n' "$INPUT_URLS" | tr '\n' ' ' | xargs)"
          if [ -z "$urls" ]; then
            echo 'Provide at least one absolute URL when mode=urls.' >&2
            exit 1
          fi

          node scripts/indexnow-submit.mjs $urls
